# ------------------------------------------------------------------
# Site settings
# ------------------------------------------------------------------
title: "Your Name"
tagline: "Developer · Designer · Creative"
description: >-
  A sleek, minimal personal website for showcasing your work, writing,
  and everything in between.
url: "https://yourusername.github.io"     # base hostname & protocol for your site
baseurl: ""                                # subpath, e.g. "/repo-name" — leave "" for user/org pages

author:
  name: "Your Name"
  email: "you@example.com"
  location: "Your City, Country"

# Social links (leave blank to hide an icon — see _includes/social-icons.html)
social:
  github:   "yourusername"
  twitter:  ""
  linkedin: ""
  mastodon: ""
  instagram: ""

# Contact form (https://formspree.io) — sign up free, drop your form id here
formspree_id: ""

# ------------------------------------------------------------------
# Build settings
# ------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge

collections:
  portfolio:
    output: true
    permalink: /work/:path/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "portfolio"
    values:
      layout: "portfolio-item"
  - scope:
      path: ""
    values:
      layout: "default"

paginate: 6
paginate_path: "/blog/page:num/"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-include-cache

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
