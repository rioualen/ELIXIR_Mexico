---
layout: default
---
<article class="single-column post">
  <header class="post-header">
    <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}{% if page.tags %} · {{ page.tags | join: ", " }}{% endif %}</p>
    <h1 class="post-title">{{ page.title }}</h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <hr>
  <p><a href="{{ '/blog/' | relative_url }}">&larr; Back to all posts</a></p>
</article>
